name: Broken Link Check

# Verifies every <a href> in the live index.html and every wiki_url in
# nobel_data.js returns 2xx/3xx. Catches regressions like the
# Frederick_J._Ramsdell 404 (caught 2026-07-04 in the portfolio E2E audit).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly catch-up: 06:00 UTC Sunday (covers anything that rots between PRs)
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check live site links
        # Default: check the live GH Pages deployment.
        # Override via the workflow_dispatch "site" input if needed.
        run: |
          SITE_INPUT="${{ inputs.site }}"
          if [ -n "$SITE_INPUT" ]; then
            node scripts/check-links.js --site "$SITE_INPUT"
          else
            node scripts/check-links.js
          fi
