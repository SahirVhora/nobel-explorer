name: Static Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify static app files
        run: |
          test -f index.html
          test -f README.md
          test -f LICENSE
          test -f nobel_data.js

      - name: Check JavaScript syntax
        run: |
          node --check nobel_data.js
          node --check scripts/check-links.js

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm test
